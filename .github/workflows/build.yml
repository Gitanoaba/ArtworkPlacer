name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # para crear el release con los archivos

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Build
        run: dotnet build ArtworkPlacer.csproj -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtworkPlacer
          path: bin/Release/ArtworkPlacer.dll

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Release/ArtworkPlacer.dll
            ArtworkPlacer.addin
            ArtworkPlacer.png
            TvPlacer.png
